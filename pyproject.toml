[project]
name = "trifouillis-city-hal"
version = "0.1.0"
description = "Agent conversationnel pour la mairie de trifouillis"
authors = [
    {name = "Bazaroph"}
]
requires-python = ">=3.12,<3.13"
package-mode = false
dependencies = [
    "docling>=2.86.0,<3.0.0",
    "openai-whisper (>=20250625,<20250626)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
